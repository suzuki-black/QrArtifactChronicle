name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    name: Rust core (fmt / clippy / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Add components
        run: rustup component add rustfmt clippy
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Test
        run: cargo test --workspace

  reference:
    name: TypeScript oracle (golden vectors)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test
        run: npm test

  audit:
    name: Security audit (cargo audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit
        run: cargo audit

# Note: the macOS SwiftUI app (apple/build-app.sh) requires macOS + Xcode and is not
# built in CI yet. Add a macos-14 job once the app is stabilized.
